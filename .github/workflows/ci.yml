name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check
        if: runner.os != 'Windows'
        run: scripts/check.sh

      - name: Check
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/check.ps1

  publish:
    name: Publish (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            artifact: dicomcli-linux-x64
            package: dicomcli-linux-x64.tar.gz
            smoke: true
          - runtime: linux-arm64
            artifact: dicomcli-linux-arm64
            package: dicomcli-linux-arm64.tar.gz
            smoke: false
          - runtime: win-x64
            artifact: dicomcli-win-x64
            package: dicomcli-win-x64.zip
            smoke: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >-
          dotnet publish src/cli/cli.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:StripSymbols=true
          -p:InvariantGlobalization=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/${{ matrix.artifact }}

      - name: Include release docs
        run: cp LICENSE README.md artifacts/${{ matrix.artifact }}/

      - name: Smoke test Linux binary
        if: matrix.smoke
        run: |
          ./artifacts/${{ matrix.artifact }}/dicomcli --version
          ./artifacts/${{ matrix.artifact }}/dicomcli tests/fixtures/sample.dcm --format text

      - name: Package Linux artifact
        if: startsWith(matrix.runtime, 'linux-')
        run: tar -czf artifacts/${{ matrix.package }} -C artifacts/${{ matrix.artifact }} .

      - name: Package Windows artifact
        if: startsWith(matrix.runtime, 'win-')
        shell: pwsh
        run: Compress-Archive -Path artifacts/${{ matrix.artifact }}/* -DestinationPath artifacts/${{ matrix.package }}

      - name: Generate checksum
        run: |
          cd artifacts
          sha256sum ${{ matrix.package }} > ${{ matrix.package }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/${{ matrix.package }}
            artifacts/${{ matrix.package }}.sha256
          if-no-files-found: error
          retention-days: 3
