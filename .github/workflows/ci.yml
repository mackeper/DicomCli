name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DicomCli.slnx

      - name: Build
        run: dotnet build DicomCli.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DicomCli.slnx --configuration Release --no-build

  publish:
    name: Publish (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            artifact: dicomcli-linux-x64
          - runtime: linux-arm64
            artifact: dicomcli-linux-arm64
          - runtime: win-x64
            artifact: dicomcli-win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >-
          dotnet publish src/cli/cli.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:StripSymbols=true
          -p:InvariantGlobalization=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/${{ matrix.artifact }}

      - name: Package Linux artifact
        if: startsWith(matrix.runtime, 'linux-')
        run: tar -czf artifacts/${{ matrix.artifact }}.tar.gz -C artifacts/${{ matrix.artifact }} .

      - name: Upload Linux artifact
        if: startsWith(matrix.runtime, 'linux-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

      - name: Upload Windows artifact
        if: startsWith(matrix.runtime, 'win-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
          if-no-files-found: error
